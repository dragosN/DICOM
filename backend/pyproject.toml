[project]
name = "dicom-portfolio"
version = "0.1.0"
description = "Interview portfolio: DICOM validation, NIfTI conversion, and study API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydicom>=3.0.0",
    "nibabel>=5.3.0",
    "numpy>=2.1.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "req_geo: geometry / orientation requirements",
    "req_val: series validation requirements",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.1",
]
