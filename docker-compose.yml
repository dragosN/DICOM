services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/data
      # Live fixtures (synthetic always; TCIA if downloaded on host)
      - ./fixtures:/fixtures:ro
    environment:
      - PYTHONUNBUFFERED=1
      - FIXTURES_ROOT=/fixtures
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_data:
